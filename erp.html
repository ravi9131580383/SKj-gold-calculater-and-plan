'<h3 style="margin-top:12px">कमीशन (सामान्य दर)</h3><div class="g2"><div><label>तरीका</label><select id="s_ct"><option value="pct"'+(c.commType!="pergram"?" selected":"")+'>% (टैक्सेबल बिक्री पर)</option><option value="pergram"'+(c.commType=="pergram"?" selected":"")+'>₹ प्रति ग्राम</option></select></div><div><label>दर</label><input id="s_cv" type="number" step="0.01" value="'+esc(c.commVal)+'"></div></div><label>श्रेणी-वार कमीशन % (हर लाइन: श्रेणी=दर)</label><textarea id="s_cc">'+esc(Object.keys(cc).map(function(k){return k+"="+cc[k]}).join("\n"))+'</textarea>'+
'<h3 style="margin-top:12px">कंपनी की जानकारी (बिल पर)</h3><div class="g2"><div><label>कंपनी का नाम</label><input id="s_cn" value="'+esc(co.name)+'"></div><div><label>GSTIN</label><input id="s_cg" maxlength="15" value="'+esc(co.gstin)+'"></div><div><label>फोन</label><input id="s_cp" value="'+esc(co.phone)+'"></div><div><label>राज्य</label><select id="s_cs">'+STATES.map(function(s){return'<option'+(co.state==s?" selected":"")+'>'+s+'</option>'}).join("")+'</select></div></div><label>पता</label><input id="s_ca" value="'+esc(co.addr)+'">'+
'<label>बिल नंबर का उपसर्ग (prefix)</label><input id="s_px" value="'+esc(c.prefix)+'" maxlength="6"><label>आइटम श्रेणियाँ (हर लाइन में एक)</label><textarea id="s_cat" style="min-height:120px">'+esc(c.cats.join("\n"))+'</textarea><label>बिल की शर्तें</label><textarea id="s_tm">'+esc(c.terms)+'</textarea><div id="s_err" class="note" style="color:var(--bad)"></div><button class="btn" data-a="setsave" type="button">💾 सेव करें</button></div>'+
'<div class="card"><h3>📥 पुराने बिल ERP में लाएँ</h3><p class="note">मुख्य साइट के पुराने सिस्टम (बिक्री / GST लॉग) में बने बिल यहाँ ERP के बिलों में जुड़ जाएँगे। दोबारा दबाने पर दोहराव नहीं होगा।</p><button class="btn" data-a="legacy" type="button">📥 पुराने बिल लाएँ</button><div id="lg_st" class="note" style="margin-top:6px"></div></div><div class="card"><h3>💾 डेटा बैकअप</h3><p class="note">स्टॉक, फ्रेंचाइज़ी, बिल, भुगतान और डिस्पैच का JSON बैकअप (KYC की फ़ाइलें छोड़कर)।</p><button class="btn s" data-a="bkp" type="button">⬇ बैकअप डाउनलोड</button></div>'};
A.setsave=function(){var g=function(i){return($("#"+i).value||"").trim()},cc={};g("s_cc").split("\n").forEach(function(l){var p=l.split("=");if(p.length==2&&p[0].trim()&&!isNaN(parseFloat(p[1])))cc[p[0].trim()]=parseFloat(p[1])});
var cats=g("s_cat").split("\n").map(function(x){return x.trim()}).filter(Boolean);if(!cats.length){$("#s_err").textContent="कम से कम एक श्रेणी रखें।";return}
var d={rate24:N(g("s_rate")),rateAg:N(g("s_ag")),autoRate:$("#s_auto").checked,mkAgType:$("#s_amt").value,mkAgVal:N(g("s_amv")),gst:N(g("s_gst")),mkType:$("#s_mt").value,mkVal:N(g("s_mv")),commType:$("#s_ct").value,commVal:N(g("s_cv")),commCat:cc,prefix:g("s_px")||"SKJ",cats:cats,terms:$("#s_tm").value,co:{name:g("s_cn"),gstin:g("s_cg").toUpperCase(),phone:g("s_cp"),state:$("#s_cs").value,addr:g("s_ca")}};
C.Fs.setDoc(ref("config","erp"),d).then(function(){toast("सेटिंग सेव हुई ✅")}).catch(function(x){$("#s_err").textContent=mapErr(x)})};
A.bkp=function(){var o={v:1,at:new Date().toISOString(),items:S.items,franchises:S.frs,transfers:S.trs,invoices:S.invs,payments:S.pays,applications:S.apps,kycdocs:S.kyc};dl(new Blob([JSON.stringify(o)],{type:"application/json"}),"SKJ_ERP_backup_"+today()+".json")};
/* ---------- live rates: gold + silver ---------- */
function jget(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("http");return r.json()})}
async function goldpriceOrg(){try{var j=await jget("https://data-asg.goldprice.org/dbXRates/INR"),it=j.items[0];return{g:(+it.xauPrice/31.1034768)||0,s:(+it.xagPrice/31.1034768)||0}}catch(e){LIVE.log.push("goldprice.org ✗");return{g:0,s:0}}}
async function fetchIntl(){LIVE.log=[];var g=async function(n,f){try{var v=await f();if(v>0)return v}catch(e){}LIVE.log.push(n+" ✗");return 0};
var xau=await g("gold-api",async function(){return+(await jget("https://api.gold-api.com/price/XAU")).price});
var xag=await g("gold-api-silver",async function(){return+(await jget("https://api.gold-api.com/price/XAG")).price});
if(!xau)xau=await g("coinbase-PAXG",async function(){return+(await jget("https://api.coinbase.com/v2/prices/PAXG-USD/spot")).data.amount});
var inr=0;if(xau>0||xag>0){inr=await g("frankfurter",async function(){return+(await jget("https://api.frankfurter.dev/v1/latest?base=USD&symbols=INR")).rates.INR});
if(!inr)inr=await g("er-api",async function(){return+(await jget("https://open.er-api.com/v6/latest/USD")).rates.INR});
if(!inr)inr=await g("coinbase-fx",async function(){return+(await jget("https://api.coinbase.com/v2/exchange-rates?currency=USD")).data.rates.INR})}
if(inr>0){var r={g:xau>0?xau*inr/31.1034768:0,s:xag>0?xag*inr/31.1034768:0};if(r.g>0&&r.s>0)return r;var o=await goldpriceOrg();return{g:r.g||o.g,s:r.s||o.s}}
return await goldpriceOrg()}
async function liveRefresh(){if(!C)return;var cd={};try{var sn=await C.Fs.getDoc(ref("public","rate"));if(sn.exists())cd=sn.data()}catch(e){}
var v=await fetchIntl();if(v.g>0)LIVE.ig=v.g;if(v.s>0)LIVE.is=v.s;if(v.g>0||v.s>0)LIVE.ts=Date.now();
var d=cd.duty!==undefined?+cd.duty:6,off=(+cd.off||0)/(cd.offu=="10"?10:1),sd=cd.sduty!==undefined?+cd.sduty:6,so=(+cd.soff||0)/(cd.soffu=="kg"?1000:1);
LIVE.g=LIVE.ig>0?LIVE.ig*(1+d/100)+off:(+cd.man||0);LIVE.s=LIVE.is>0?LIVE.is*(1+sd/100)+so:(+cd.sman||0);sched()}
function liveInfo(){return"सोना 24K: <b>"+(LIVE.g?inr(LIVE.g)+"/g":"—")+"</b> · चाँदी 999: <b>"+(LIVE.s?inr(LIVE.s)+"/g (₹"+Math.round(LIVE.s*1000).toLocaleString("en-IN")+"/किलो)":"—")+"</b>"+(LIVE.ts?" · अपडेट "+new Date(LIVE.ts).toLocaleTimeString("hi-IN"):"")+(LIVE.log.length?" · नहीं चले: "+LIVE.log.join(", "):"")}
function rateStrip(){return'<div class="rstrip"><span>📈 आज का रेट</span><span>🟡 सोना 24K <b>'+(rates().g?inr(rates().g):"—")+'</b>/g</span><span>⚪ चाँदी 999 <b>'+(rates().s?inr(rates().s):"—")+'</b>/g</span></div>'}
var dash0=VIEWS.dash;VIEWS.dash=function(){return rateStrip()+dash0()};
/* ---------- legacy bills -> ERP invoices ---------- */
function legacyToInv(s){var it=s.items||[],tt=s.tt||"intra",gp=it[0]?(N(it[0].gr)||3):3,lines=[],tx=0,cg=0,sg=0,ig=0,gs=0,tot=0;
it.forEach(function(x){var g=N(x.g),m=N(x.m),t=R2(g+m),gst=N(x.gs),c=tt=="inter"?0:R2(gst/2),s2=tt=="inter"?0:R2(gst-R2(gst/2)),i=tt=="inter"?gst:0;
lines.push({itemId:"",huid:x.huid||"",name:x.name||"",cat:"",purity:"",metal:"gold",thumb:x.thumb||"",qty:1,net:N(x.w),rate:N(x.r),gold:g,making:m,disc:0,taxable:t,gst:gst,cgst:c,sgst:s2,igst:i,total:R2(N(x.tot))});tx+=t;cg+=c;sg+=s2;ig+=i;gs+=gst;tot+=N(x.tot)});
var total=Math.round(tot);return{id:"L"+s.id,no:s.no,type:"customer",fid:"HO",sellerId:"HO",date:s.date,cust:{name:s.cname||"",mobile:s.cphone||"",addr:"",state:cfg().co.state,gstin:s.gstin||"",pan:""},tt:tt,gstPct:gp,billDisc:0,lines:lines,taxable:R2(tx),cgst:R2(cg),sgst:R2(sg),igst:R2(ig),gst:R2(gs),round:R2(total-tot),total:total,pays:[{mode:"cash",amt:total,ref:"पुराना बिल",date:s.date,by:s.byId||""}],paid:total,retAmt:0,note:"पुराने सिस्टम से लाया गया"+(s.gst?"":" (GST लॉग में नहीं था)"),vc:s.vc||"",sealed:false,sig:s.sig||"",legacy:true,ts:Date.now(),by:U.id,byName:U.name}}
A.legacy=function(){if(!isAdmin())return;var st=$("#lg_st");st.textContent="⏳ पुराने बिल पढ़ रहे हैं…";
C.Fs.getDocs(col("sales")).then(function(sn){var L=sn.docs.map(function(d){return Object.assign({id:d.id},d.data())}).filter(function(s){return s.no&&!S.invs.some(function(i){return i.id=="L"+s.id})});
if(!L.length){st.textContent="कोई नया पुराना बिल नहीं मिला (सब पहले ही आ चुके हैं या कोई बिल नहीं)।";return}
if(!confirm(L.length+" पुराने बिल ERP में लाएँ? (इन्हें 'पूरा भुगतान' माना जाएगा; स्टॉक पर असर नहीं पड़ेगा)"))return;
var i=0;(function next(){if(i>=L.length){st.textContent="✅ "+L.length+" बिल आ गए।";toast("पुराने बिल ERP में आ गए ✅");return}var b=C.Fs.writeBatch(C.db);L.slice(i,i+200).forEach(function(s){var inv=legacyToInv(s);b.set(ref("invoices",inv.id),inv)});b.commit().then(function(){i+=200;next()}).catch(function(e){st.textContent="त्रुटि: "+mapErr(e)})})()}).catch(function(e){st.textContent="पुराने बिल नहीं पढ़ पाए: "+mapErr(e)})};
/* ---------- start ---------- */
function boot(){if(new URLSearchParams(location.search).get("apply")){applyView();return}
if(!ON){loginView("Firebase सेटअप बाकी है");return}
initFb().then(function(){return new Promise(function(res){var un=C.Au.onAuthStateChanged(C.auth,function(u){un();res(u)})})}).then(function(u){if(u)return loadProfile(u).catch(function(){loginView()});loginView()}).catch(function(e){loginView(mapErr(e))})}
boot();
})();
</script></body></html>
